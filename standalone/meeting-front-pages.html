<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meeting Front Pages</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@400;500;600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/meeting-front-pages.css?v=5" />
</head>
<body>
  <div class="mfp-app">
    <header class="mfp-toolbar">
      <div class="mfp-toolbar__left">
        <p class="mfp-toolbar__eyebrow">Scouts · <a href="/">← All apps</a></p>
        <h1 class="mfp-toolbar__title">Meeting Front Pages</h1>
        <p class="mfp-toolbar__subtitle">Identity + profile title PNGs for scout video presentations</p>
      </div>
      <div class="mfp-toolbar__right">
        <button type="button" class="mfp-btn mfp-btn--ghost" id="refreshPhotosBtn" disabled>Find web photos</button>
        <button type="button" class="mfp-btn mfp-btn--ghost" id="refreshBtn" disabled>Reload player</button>
        <button type="button" class="mfp-btn" id="downloadBtn" disabled>Download PNG pack</button>
      </div>
    </header>

    <section class="mfp-controls">
      <div class="mfp-search">
        <label class="mfp-label" for="playerSearch">Player</label>
        <input id="playerSearch" class="mfp-input" type="search" placeholder="Search Impect players…" autocomplete="off" />
        <ul id="searchResults" class="mfp-results" hidden></ul>
      </div>
      <div class="mfp-cutout">
        <label class="mfp-label" for="cutoutInput">Own cutout (optional)</label>
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
          <input id="cutoutInput" type="file" accept="image/png,image/jpeg,image/webp" />
          <button type="button" class="mfp-btn mfp-btn--ghost mfp-btn--small" id="clearCutoutBtn" disabled>Clear upload</button>
        </div>
        <p class="mfp-hint">Prefer a web photo below — or paste/upload a transparent PNG cutout.</p>
      </div>
    </section>

    <div id="statusBanner" class="mfp-status hidden" role="status"></div>

    <section class="mfp-photos" id="photoPanel" hidden>
      <div class="mfp-photos__head">
        <h2>Photos from the internet</h2>
        <span class="mfp-hint" id="photoMeta"></span>
      </div>
      <div class="mfp-photo-grid" id="photoGrid"></div>
    </section>

    <div class="mfp-workspace" id="workspace" hidden>
      <aside class="mfp-editor" id="editor"></aside>
      <main class="mfp-preview" id="preview" aria-live="polite"></main>
    </div>
  </div>

  <script defer src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <script src="/static/meeting-front-pages.js?v=5"></script>
</body>
</html>
