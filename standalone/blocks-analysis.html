<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blocks Analysis</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/blocks-analysis.css?v=42" />
</head>
<body>
  <div class="ba-app">
    <header class="ba-toolbar">
      <div class="ba-toolbar__left">
        <p class="ba-toolbar__eyebrow">Analysis · <a href="/">← All apps</a></p>
        <h1 class="ba-toolbar__title">Blocks Analysis</h1>
        <p class="ba-toolbar__subtitle" id="pageSubtitle">Nine blocks of five · League Two</p>
      </div>
      <div class="ba-toolbar__right">
        <button type="button" class="ba-btn ba-btn--ghost" id="exportAllBtn">Export all PNGs</button>
        <button type="button" class="ba-btn ba-btn--ghost" id="refreshBtn">Refresh</button>
      </div>
    </header>

    <nav class="ba-jump" id="jumpNav" aria-label="Jump to block"></nav>
    <div id="statusBanner" class="ba-status hidden" role="status"></div>
    <main id="blocksRoot" class="ba-main" aria-live="polite"></main>
    <footer id="statusBar" class="ba-footer">Loading…</footer>
  </div>

  <script defer src="/static/blocks-analysis.js?v=42"></script>
</body>
</html>
