    .lane__bar {

    /* Intro slide — empty lanes with question marks */

    /* Edit / non-present: show the real points immediately */

    body:not(.is-present) .outcome-lanes--reveal .lane__value--real { display: block; }

    /* Phase type — three big cards on a mini podium */
    .phase-trio {

    body.is-present .goals-map__pitch {

        DM: raw.DM,
        CB: raw.CB,
        LB: raw.LB - lbToWing,
        RB: raw.RB - rbToWing,
      };
    }

    function getCopyChoice(key, fallback) {

    function copyPickHtml(key, fallback, options, extraClass = "") {
      const opts = options && options.length ? options : [fallback];
      const selected = getCopyChoice(key, fallback);
      const value = opts.includes(selected) ? selected : fallback;
      const optionsHtml = opts.map((o) => `<option value="${o.replace(/"/g, "&quot;")}"${o === value ? " selected" : ""}>${o}</option>`).join("");
      return `
        <div class="copy-pick-wrap${extraClass.includes("footer") ? " copy-pick-wrap--footer" : ""}${extraClass.includes("gap") ? " gap" : ""}" data-copy-key="${key}">
          <select class="copy-pick ${extraClass}" data-copy-key="${key}" aria-label="Choose line">${optionsHtml}</select>
          <p class="copy-pick__present">${value}</p>
        </div>`;
    }
    function syncCopyPresentText(select) {
      const wrap = select.closest(".copy-pick-wrap");
      const present = wrap?.querySelector(".copy-pick__present");
      if (present) present.textContent = select.value;
    }
    function bindCopyPicks() {
      document.querySelectorAll(".copy-pick").forEach((select) => {
        if (select.dataset.bound) return;
        select.dataset.bound = "1";
        syncCopyPresentText(select);
        select.addEventListener("change", () => {
          const store = getCopyStore();
          store[select.dataset.copyKey] = select.value;
          saveCopyStore(store);
          syncCopyPresentText(select);
        });
      });
    }

    function laneHtml(kind) {
      const lanes = [
        { key: "champ", cls: "champ", tag: "1st", outcome: "Champions" },
        { key: "auto", cls: "auto", tag: "2nd–3rd", outcome: "Automatic" },
        { key: "po", cls: "po", tag: "4th–7th", outcome: "Play-offs" },
      ];
      const hints = COPY.lane[kind] || {};
      const datasets = {
        points: DATA.points, home: DATA.home, away: DATA.away,
        b2b: DATA.b2b, streak: DATA.streak,
        gf: DATA.gf, ga: DATA.ga, cs: DATA.cs,
        blockPoints: DATA.blockPoints, blockGf: DATA.blockGf,
        blockGa: DATA.blockGa, blockCs: DATA.blockCs,
      };
      const units = {
        points: "points", home: "home wins", away: "away wins",
        b2b: "back-to-backs", streak: "in a row",
        gf: "goals", ga: "conceded", cs: "clean sheets",
        blockPoints: "pts / 6 games", blockGf: "goals / 6",
        blockGa: "conceded / 6", blockCs: "cleans / 6",
      };
      const stepRanks = { champ: "1", auto: "2–3", po: "4–7" };
      const max = arguments[1] || 92;

      return `<div class="outcome-lanes${kind === "points" ? " outcome-lanes--reveal" : ""}" data-morph-group="outcome-lanes">${lanes.map((lane) => {
        const val = datasets[kind]?.[lane.key];
        const pct = val ? Math.round((val / max) * 100) : 0;
        // Intro and points share the same layout shell so the cards stay locked —
        // points starts as ? and reveals one number per click in present mode.
        const display = (kind === "intro" || kind === "points")
          ? `<span class="lane__value lane__value--ghost" data-reveal-ghost>?</span>
             <span class="lane__value lane__value--real" data-reveal-real data-morph-id="value-${lane.key}">${kind === "points" ? val : ""}</span>
             <span class="lane__unit">points</span>
             <div class="lane__bar${kind === "intro" ? " lane__bar--ghost" : ""}" data-morph-id="bar-${lane.key}"><div class="lane__bar-fill" style="width:${pct}%"></div></div>`
          : `<span class="lane__value" data-morph-id="value-${lane.key}">${val}</span><span class="lane__unit">${units[kind] || ""}</span>
             <div class="lane__bar" data-morph-id="bar-${lane.key}"><div class="lane__bar-fill" style="width:${pct}%"></div></div>`;
        return `
          <div class="podium-col podium-col--${lane.cls}${kind === "intro" || kind === "points" ? "" : " is-revealed"}">
            <article class="lane lane--${lane.cls}">
              <div class="lane__head">
                <span class="lane__tag">${lane.tag}</span>
                <span class="lane__outcome">${lane.outcome}</span>
              </div>
              <div class="lane__metric">${display}</div>
              <div class="lane__hint">${copyPickHtml(`lane:${kind}:${lane.key}`, (hints[lane.key] || [])[0] || "", hints[lane.key] || [], "copy-pick--lane")}</div>
            </article>
            <div class="podium-step podium-step--${lane.cls}">
              <span class="podium-step__rank">${stepRanks[lane.key]}</span>
            </div>
          </div>`;
      }).join("")}</div>`;
    }

    function phaseTrio(kind) {
      const auto = kind === "for" ? DATA.phasesFor : DATA.phasesAgainst;
      const po = kind === "for" ? DATA.phasesForPo : DATA.phasesAgainstPo;
      const total = auto.poss + auto.trans + auto.sp;
      const cardMeta = {
        poss: {
          key: "poss",
          name: "Possession",
          note: kind === "for" ? "Patient build-up" : "Stay compact",
          icon: `<svg class="phase-card__icon" viewBox="0 0 48 48" fill="none" aria-hidden="true"><circle cx="24" cy="24" r="14" stroke="currentColor" stroke-width="2.5"/><circle cx="24" cy="24" r="4" fill="currentColor"/><path d="M24 10v4M24 34v4M10 24h4M34 24h4" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>`,
        },
        trans: {
          key: "trans",
          name: "Transition",
          note: kind === "for" ? "Win it and go" : "Recover quickly",
          hot: kind === "against",
          icon: `<svg class="phase-card__icon" viewBox="0 0 48 48" fill="none" aria-hidden="true"><path d="M8 24h24M26 14l12 10-12 10" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M8 16v16" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"/></svg>`,
        },
        sp: {
          key: "sp",
          name: "Set piece",
          note: kind === "for" ? "The +6 vs play-offs" : "First contact counts",
          hot: true,
          edge: kind === "for" ? "Set pieces" : "Both ends",
          icon: `<svg class="phase-card__icon" viewBox="0 0 48 48" fill="none" aria-hidden="true"><path d="M10 38V18l14-8 14 8v20" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/><path d="M18 38V26h12v12" stroke="currentColor" stroke-width="2.5"/><circle cx="24" cy="20" r="2.5" fill="currentColor"/></svg>`,
        },
      };
      // Set piece dead-centre so the eye lands on the promotion edge
      const cards = kind === "for"
        ? [cardMeta.poss, cardMeta.sp, cardMeta.trans]
        : [cardMeta.poss, cardMeta.trans, cardMeta.sp];
      const strip = ["poss", "trans", "sp"].map((key) => {
        const pct = Math.round((auto[key] / total) * 100);
        return `<div class="phase-strip__seg--${key}" style="width:${pct}%"></div>`;
      }).join("");

      function deltaHtml(autoVal, poVal, isSp) {
        const diff = autoVal - poVal;
        if (kind === "for") {
          if (diff > 0) {
            const label = isSp ? `+${diff} vs play-offs` : `+${diff} vs play-offs`;
            return `<span class="phase-cmp__delta phase-cmp__delta--up">${label}</span>`;
          }
          if (diff < 0) return `<span class="phase-cmp__delta phase-cmp__delta--down">${diff} vs play-offs</span>`;
          return `<span class="phase-cmp__delta phase-cmp__delta--flat">Level with play-offs</span>`;
        }
        if (diff < 0) return `<span class="phase-cmp__delta phase-cmp__delta--good">${diff} vs play-offs</span>`;
        if (diff > 0) return `<span class="phase-cmp__delta phase-cmp__delta--down">+${diff} vs play-offs</span>`;
        return `<span class="phase-cmp__delta phase-cmp__delta--flat">Level with play-offs</span>`;
      }

      return `
        <div style="display:flex;flex-direction:column;gap:0.5rem;width:100%;height:100%;">
          <div class="phase-trio" data-morph-group="phase-trio">
            ${cards.map((c) => {
              const val = auto[c.key];
              const poVal = po[c.key];
              const pct = Math.round((val / total) * 100);
              const isSp = c.key === "sp";
              const hotCls = c.hot
                ? (kind === "against" && !isSp ? " phase-card--danger phase-card--hot" : " phase-card--hot")
                : " phase-card--muted";
              const edge = c.edge ? `<span class="phase-card__edge">${c.edge}</span>` : "";
              const phaseKey = `phase-${kind}:${c.key}`;
              const phaseOpts = COPY.phase[phaseKey] || [c.note];
              const notePick = copyPickHtml(phaseKey, c.note, phaseOpts, "copy-pick--phase");
              return `
                <article class="phase-card phase-card--${c.key}${hotCls}" data-morph-id="phase-card-${c.key}">
                  <div class="phase-card__head">
                    ${edge}
                    ${c.icon}
                    <p class="phase-card__name">${c.name}</p>
                    <p class="phase-card__value" data-morph-id="phase-val-${c.key}">${val}</p>
                    <span class="phase-card__unit">${kind === "for" ? "auto goals" : "auto conceded"}</span>
                  </div>
                  <div class="phase-card__cmp">
                    <div class="phase-cmp__stack">
                      <div class="phase-cmp__cell phase-cmp__cell--auto">
                        <span class="phase-cmp__label">Auto</span>
                        <span class="phase-cmp__num">${val}</span>
                      </div>
                      <div class="phase-cmp__cell">
                        <span class="phase-cmp__label">Play-offs</span>
                        <span class="phase-cmp__num">${poVal}</span>
                      </div>
                    </div>
                    ${deltaHtml(val, poVal, isSp)}
                  </div>
                  <div class="phase-card__foot">
                    <span class="phase-card__pct">${pct}%</span>
                    ${notePick}
                  </div>
                </article>`;
            }).join("")}
          </div>
          <div class="phase-strip" data-morph-id="phase-strip" aria-hidden="true">${strip}</div>
        </div>`;
    }

    function posCardHtml(r, tier) {

    function renderPosCards(kind = "goals") {
      // Pyramid by contribution: CF → next biggest → rest
      if (kind === "assists") {
        const pos = assistsByPositionMerged();
        const total = DATA.assistsTotal;
        const metric = "assists";
        const r = (v) => Math.round(v);
        const pct = (v) => Math.round((v / total) * 100);
        const wideTotal = r(pos.LW + pos.RW);

        const apex = [{ tag: "CF", role: "Striker", goals: r(pos.CF), pct: pct(r(pos.CF)), total, metric }];
        const mid = [
          { tag: "AM", role: "No. 10", goals: r(pos.AM), pct: pct(r(pos.AM)), total, metric },
          { tag: "DEF", role: "Defenders", goals: r(pos.CB + pos.LB + pos.RB), pct: pct(r(pos.CB + pos.LB + pos.RB)), total, metric },
        ];
        const base = [
          { tag: "CM", role: "Central mid", goals: r(pos.CM), pct: pct(r(pos.CM)), total, metric },
          { tag: "DM", role: "Holding mid", goals: r(pos.DM), pct: pct(r(pos.DM)), total, metric },
          { tag: "W", role: "Wingers", goals: wideTotal, pct: pct(wideTotal), total, metric },
        ];

        return `
          <div class="pos-pyramid" data-morph-group="pos-pyramid">
            <div class="pos-pyramid__row pos-pyramid__row--1">${apex.map((x) => posCardHtml(x, "apex")).join("")}</div>
            <div class="pos-pyramid__row pos-pyramid__row--2">${mid.map((x) => posCardHtml(x, "mid")).join("")}</div>
            <div class="pos-pyramid__row pos-pyramid__row--3">${base.map((x) => posCardHtml(x, "base")).join("")}</div>
          </div>`;
      }

      // Default: goals (existing layout numbers)
      const apex = [{ tag: "CF", role: "Striker", goals: 27, pct: 38, total: 72, metric: "goals" }];
      const mid = [
        { tag: "AM", role: "No. 10", goals: 10, pct: 14, total: 72, metric: "goals" },
        { tag: "DEF", role: "Defenders", goals: 12, pct: 17, total: 72, metric: "goals" },
      ];
      const base = [
        { tag: "CM", role: "Central mid", goals: 6, pct: 8, total: 72, metric: "goals" },
        { tag: "DM", role: "Holding mid", goals: 6, pct: 8, total: 72, metric: "goals" },
        { tag: "W", role: "Wingers", goals: 5, pct: 7, total: 72, metric: "goals" },
      ];
      return `
        <div class="pos-pyramid" data-morph-group="pos-pyramid">
          <div class="pos-pyramid__row pos-pyramid__row--1">${apex.map((x) => posCardHtml(x, "apex")).join("")}</div>
          <div class="pos-pyramid__row pos-pyramid__row--2">${mid.map((x) => posCardHtml(x, "mid")).join("")}</div>
          <div class="pos-pyramid__row pos-pyramid__row--3">${base.map((x) => posCardHtml(x, "base")).join("")}</div>
        </div>`;
    }

    function pitchMarker(pos, goals) {
      const slot = DATA.pitchSlots[pos];
      const isCf = pos === "CF";
      const isAm = pos === "AM";
      const w = isCf ? 13 : 11.5;
      const h = isCf ? 10.5 : 9.5;
      const cx = slot.x;
      const cy = slot.y;
      const cardCls = `map-marker__card${isCf ? " map-marker__card--cf" : ""}${isAm ? " map-marker__card--am" : ""}`;
      const abbrCls = `map-marker__abbr${isCf ? " map-marker__abbr--cf" : ""}`;
      const valCls = `map-marker__val${isCf ? " map-marker__val--cf" : ""}`;
      // Live deck uses SVG (scales with pitch, Magic Move). Export paints these to canvas.
      return `
        <g data-morph-id="node-${pos}" data-pitch-pos="${pos}" data-pitch-val="${goals}">
          <rect class="${cardCls}" x="${cx - w / 2}" y="${cy - h / 2}" width="${w}" height="${h}" rx="1.6"/>
          <text class="${abbrCls}" x="${cx}" y="${cy - 1.1}">${pos}</text>
          <text class="${valCls}" x="${cx}" y="${cy + 3.6}">${goals}</text>
        </g>`;
    }

    function renderPitch(metric = "goals") {
      const isAssists = metric === "assists";
      const pos = isAssists ? assistsPosRounded() : DATA.positions;
      const total = isAssists
        ? DATA.assistsTotal
        : Object.values(pos).reduce((a, b) => a + b, 0);
      const leadId = "CF";
      const leadVal = pos[leadId];
      const leadPct = Math.round((leadVal / total) * 100);
      const order = isAssists
        ? ["CF", "AM", "LW", "RW", "CM", "DM", "CB", "RB", "LB"]
        : ["CF", "AM", "RW", "LW", "CM", "DM", "CB", "RB", "LB"];
      const max = Math.max(...order.map((id) => pos[id]));
      const unit = isAssists ? "assists" : "goals";
      const heroTitle = isAssists
        ? "Team assists · auto-promotion average"
        : "Striker goals · auto-promotion average";
      const heroSub = isAssists
        ? "Wingers and wing-backs create — full-backs still chip in"
        : "Wide players, mids and full-backs create — striker scores";

      const svgId = isAssists ? "assists-pitch" : "goals-pitch";
      const markers = order.map((id) => pitchMarker(id, pos[id])).join("");
      const rows = order.map((id) => {
        const rowCls = id === leadId
          ? (isAssists ? " goals-row--cf" : " goals-row--cf")
          : (id === "AM" ? " goals-row--am" : "");
        return `
          <div class="goals-row${rowCls}" data-morph-id="${isAssists ? "ast" : "row"}-${id}">
            <span class="goals-row__tag">${id}</span>
            <div class="goals-row__track"><div class="goals-row__fill" style="width:${Math.round((pos[id] / max) * 100)}%"></div></div>
            <span class="goals-row__val">${pos[id]}</span>
          </div>`;
      }).join("");

      return `
        <div class="goals-map" data-morph-group="${isAssists ? "assists-map" : "goals-map"}">
          <div class="goals-map__hero" data-morph-id="${isAssists ? "ast-hero" : "cf-hero"}">
            <div class="goals-map__hero-val">${leadVal}</div>
            <div class="goals-map__hero-copy">
              <strong>${heroTitle}</strong>
              <span>${heroSub}</span>
            </div>
            <div class="goals-map__hero-pct">
              <em>${leadPct}%</em>
              <small>of ${total} team ${unit}</small>
            </div>
          </div>
          <div class="goals-map__body">
            <div class="goals-map__pitch">
              <svg class="goals-map__svg" viewBox="0 0 68 105" preserveAspectRatio="xMidYMid meet" role="img" aria-label="${isAssists ? "Assists" : "Goals"} by position on a 4-3-3 pitch" data-pitch-metric="${metric}">
                ${pitchLinesSvg(svgId)}
                ${markers}
              </svg>
            </div>
            <div class="goals-map__board">
              <div class="goals-map__board-head"><span>Position</span><span>${isAssists ? "Assists" : "Goals"}</span></div>
              <div class="goals-map__rows">${rows}</div>
            </div>
          </div>
        </div>`;
    }

                <p class="slide__kicker">${s.kicker || ""}</p>
                <h2 class="slide__hero-title">${s.title}</h2>
                ${s.sub ? `<p class="slide__hero-sub">${s.sub}</p>` : ""}
              </div>
              <div class="title-photo title-photo--${s.photo}">
                <img src="${photoSrc}" alt="" />
              </div>`;
        } else {
          body = `
              <div class="slide-badge-row">
                <img class="slide-badge" src="${BADGE}" width="120" height="137" alt="Port Vale FC" />
              </div>
              ${s.act ? `<span class="slide__act">${s.act}</span>` : ""}
              <p class="slide__kicker">${s.kicker || ""}</p>
              <h2 class="slide__hero-title">${s.title}</h2>
              <p class="slide__hero-sub">${s.sub || ""}</p>`;
        }
        return `
          <section class="${cls}" data-slide="${i + 1}" data-label="${s.label}">
            <div class="slide__corner slide__corner--left"></div>
            <div class="slide__corner slide__corner--right"></div>
            ${hasPhoto || s.close ? "" : `
            <img class="slide__watermark slide__watermark--left" src="${BADGE}" alt="" aria-hidden="true" />
            <img class="slide__watermark slide__watermark--right" src="${BADGE}" alt="" aria-hidden="true" />`}
            <div class="slide__inner">${body}</div>
            <div class="slide__footer-bar">${s.footer}</div>
          </section>`;
      }

      let canvas = "";
      if (s.lanes) canvas = laneHtml(s.lanes, s.max);
      if (s.phase === "for") canvas = phaseTrio("for");
      if (s.phase === "against") canvas = phaseTrio("against");
      if (s.pitch) canvas = renderPitch("goals");
      if (s.assistsBoard) canvas = renderPitch("assists");
      if (s.posCards) canvas = renderPosCards(s.posCards === true ? "goals" : s.posCards);

      const canvasClass = "keynote__canvas";
      const lineClass = `keynote__line${s.footerClass ? ` ${s.footerClass}` : ""}`;
      const footerPick = s.copyId
        ? copyPickHtml(s.copyId, s.footer, COPY.footer[s.copyId] || [s.footer], `copy-pick--footer ${lineClass}`.trim())
        : `<p class="${lineClass}">${s.footer}</p>`;

      return `
        <section class="slide slide--content" data-slide="${i + 1}" data-label="${s.label}">
          <div class="keynote">
            <div class="keynote__bar">
              <div class="keynote__bar-left">
                <img class="keynote__bar-badge" src="${BADGE}" width="28" height="32" alt="" />
                <span>${s.bar}</span>
              </div>
              <span class="keynote__bar-num">${String(i + 1).padStart(2, "0")} / ${SLIDES.length}</span>
            </div>
            <div class="keynote__body">
              <h2 class="keynote__headline">${s.headline}</h2>
              <div class="${canvasClass}">${canvas}</div>
              ${footerPick}
            </div>
          </div>
        </section>`;
    }

    const deck = document.getElementById("deck");
    const filmstrip = document.getElementById("filmstrip");
    const presentProgress = document.getElementById("presentProgress");
    deck.innerHTML = SLIDES.map(renderSlide).join("");
    bindCopyPicks();
    const slides = Array.from(document.querySelectorAll(".slide"));

    slides.forEach((slide, i) => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "filmstrip__item" + (i === 0 ? " is-active" : "");
      btn.textContent = String(i + 1).padStart(2, "0");
      btn.title = slide.dataset.label || `Slide ${i + 1}`;
      btn.addEventListener("click", () => { show(i); slide.scrollIntoView({ behavior: "smooth", block: "center" }); });
      filmstrip.appendChild(btn);
      const dot = document.createElement("button");
      dot.type = "button";
      dot.setAttribute("aria-label", `Go to slide ${i + 1}`);
      dot.addEventListener("click", (e) => {
        e.stopPropagation();
        document.body.classList.add("is-nav-hinted");
        show(i);
      });
      presentProgress.appendChild(dot);
    });

    const meta = document.getElementById("slideMeta");
    const presentBtn = document.getElementById("presentBtn");
    const presentCount = document.getElementById("presentCount");
    let index = 0;
    let animating = false;
    const BUILD_ORDER = ["podium-col--champ", "podium-col--auto", "podium-col--po"];

    function getBuildCols(slide) {
      return BUILD_ORDER.map(cls => slide.querySelector(`.outcome-lanes--reveal .${cls}`)).filter(Boolean);
    }

    function setOutcomeBuilt(slide, built) {
      // Cards themselves are always shown; "built" keeps present-mode opacity on.
      slide.querySelectorAll(".outcome-lanes .podium-col").forEach((c) => {
        if (built) c.classList.add("is-built");
        else c.classList.remove("is-built");
      });
    }

    function resetReveals(slide) {
      slide.querySelectorAll(".outcome-lanes--reveal .podium-col").forEach((c) => {
        c.classList.remove("is-revealed");
      });
    }

    function buildNext(slide) {
      const cols = getBuildCols(slide);
      if (!cols.length) return false;
      const next = cols.find(c => !c.classList.contains("is-revealed"));
      if (!next) return false;
      next.classList.add("is-revealed");
      return true;
    }

    function buildPrev(slide) {
      const cols = getBuildCols(slide);
      if (!cols.length) return false;
      const revealed = [...cols].reverse().find(c => c.classList.contains("is-revealed"));
      if (!revealed) return false;
      revealed.classList.remove("is-revealed");
      return true;
    }

    function allBuilt(slide) {
      const cols = getBuildCols(slide);
      return !cols.length || cols.every(c => c.classList.contains("is-revealed"));
    }

    function goForward() {
      if (animating) return;
      if (document.body.classList.contains("is-present") && buildNext(slides[index])) {
        updateChrome();
        return;
      }
      show(index + 1);
    }

    function goBack() {
      // Instant reverse — skip morph lock and build unwinding so you can fly back.
      if (index <= 0) return;
      show(index - 1, { animate: false });
    }
    const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    const MORPH_MS = 1450;

    function updateChrome() {
      filmstrip.querySelectorAll(".filmstrip__item").forEach((el, n) => el.classList.toggle("is-active", n === index));
      presentProgress.querySelectorAll("button").forEach((el, n) => el.classList.toggle("is-active", n === index));
      const label = slides[index].dataset.label || "";
      meta.textContent = document.body.classList.contains("is-present")
        ? `Slide ${index + 1} of ${slides.length} · ${label}`
        : `${slides.length} slides · Present mode uses Magic Move on shared lanes`;
      presentCount.textContent = `${String(index + 1).padStart(2, "0")} / ${slides.length}`;
      const prevBtn = document.getElementById("presentPrev");
      const nextBtn = document.getElementById("presentNext");
      if (prevBtn) prevBtn.disabled = index <= 0;
      if (nextBtn) nextBtn.disabled = index >= slides.length - 1 && allBuilt(slides[index]);
    }

    function clearMorphGhosts() {
      document.querySelectorAll(".morph-ghost").forEach((g) => g.remove());
    }

    function rectOf(el) {
      const r = el.getBoundingClientRect();
      return { left: r.left, top: r.top, width: r.width, height: r.height };
    }

    function captureMorph(slide) {
      const map = new Map();
      slide.querySelectorAll("[data-morph-id]").forEach((el) => {
        const id = el.getAttribute("data-morph-id");
        if (!id) return;
        map.set(id, { el, rect: rectOf(el) });
      });
      return map;
    }

    function runMagicMove(fromSlide, toSlide) {
      // Keep the three outcome cards locked in place — never morph the podium shell.
      // Intro → points (and other lane→lane swaps) should just swap the centre value.
      const fromLanes = fromSlide.querySelector(".outcome-lanes");
      const toLanes = toSlide.querySelector(".outcome-lanes");
      if (fromLanes && toLanes) return false;

      const fromMap = captureMorph(fromSlide);
      const pairs = [];
      toSlide.querySelectorAll("[data-morph-id]").forEach((toEl) => {
        const id = toEl.getAttribute("data-morph-id");
        const from = fromMap.get(id);
        if (!from) return;
        pairs.push({ id, fromEl: from.el, toEl, fromRect: from.rect, toRect: rectOf(toEl) });
      });
      if (!pairs.length) return false;

      pairs.forEach(({ fromEl, toEl, fromRect, toRect }) => {
        fromEl.style.visibility = "hidden";
        toEl.style.visibility = "hidden";

        const ghost = fromEl.cloneNode(true);
        ghost.classList.add("morph-ghost");
        ghost.removeAttribute("data-morph-id");
        ghost.style.left = "0";
        ghost.style.top = "0";
        ghost.style.width = `${fromRect.width}px`;
        ghost.style.height = `${fromRect.height}px`;
        ghost.style.transformOrigin = "top left";
        ghost.style.transform = `translate(${fromRect.left}px, ${fromRect.top}px)`;
        ghost.style.opacity = "1";
        document.body.appendChild(ghost);

        const sx = toRect.width / Math.max(fromRect.width, 1);
        const sy = toRect.height / Math.max(fromRect.height, 1);
        requestAnimationFrame(() => {
          ghost.style.transform = `translate(${toRect.left}px, ${toRect.top}px) scale(${sx}, ${sy})`;
          ghost.style.opacity = "0.95";
        });
      });

      window.setTimeout(() => {
        pairs.forEach(({ fromEl, toEl }) => {
          fromEl.style.visibility = "";
          toEl.style.visibility = "";
        });
        clearMorphGhosts();
      }, MORPH_MS);

      return true;
    }

    function settleSlide(slide) {
      slide.classList.remove("is-entering", "is-leaving", "is-morphing-host");
      slide.style.visibility = "";
      slide.style.opacity = "";
      slide.style.transform = "";
      slide.style.transition = "";
    }

    function showInstant(i) {
      index = Math.max(0, Math.min(slides.length - 1, i));
      const presenting = document.body.classList.contains("is-present");
      animating = false;
      clearMorphGhosts();
      slides.forEach((s, n) => {
        settleSlide(s);
        setOutcomeBuilt(s, true);
        // Keep reveals when jumping around so going back stays readable.
        // Fresh present entry still starts points as ??? via setPresent → showInstant(0) after reset.
        if (!presenting) {
          s.querySelectorAll(".outcome-lanes--reveal .podium-col").forEach((c) => c.classList.add("is-revealed"));
        }
        s.classList.toggle("is-active", n === index);
      });
      updateChrome();
    }

    function show(i, { animate = true } = {}) {
      const next = Math.max(0, Math.min(slides.length - 1, i));
      if (next === index) { updateChrome(); return; }

      const presenting = document.body.classList.contains("is-present");
      if (!presenting || !animate || reduceMotion || animating) {
        showInstant(next);
        return;
      }

      animating = true;
      const fromSlide = slides[index];
      const toSlide = slides[next];
      index = next;

      fromSlide.classList.add("is-leaving");
      fromSlide.classList.remove("is-active");
      toSlide.classList.add("is-entering", "is-active", "is-morphing-host");
      setOutcomeBuilt(toSlide, true);
      resetReveals(toSlide);

      // Force layout so morph targets have real rects
      void toSlide.offsetWidth;
      const lockedLanes = !!(fromSlide.querySelector(".outcome-lanes") && toSlide.querySelector(".outcome-lanes"));
      const didMorph = lockedLanes ? false : runMagicMove(fromSlide, toSlide);

      // Intro → points: keep cards locked — pure fade, no scale drift
      if (lockedLanes) {
        fromSlide.style.transition = "opacity 0.7s cubic-bezier(0.33, 1, 0.68, 1)";
        fromSlide.style.transform = "none";
        toSlide.style.opacity = "0";
        toSlide.style.transform = "none";
        toSlide.style.transition = "opacity 0.7s cubic-bezier(0.33, 1, 0.68, 1)";
        requestAnimationFrame(() => {
          toSlide.style.opacity = "1";
          fromSlide.style.opacity = "0";
        });
        updateChrome();
        window.setTimeout(() => {
          settleSlide(fromSlide);
          fromSlide.classList.remove("is-active");
          settleSlide(toSlide);
          toSlide.classList.add("is-active");
          animating = false;
        }, 760);
        return;
      }

      requestAnimationFrame(() => {
        toSlide.classList.add("is-active");
        toSlide.style.opacity = "1";
        toSlide.style.transform = "scale(1)";
        toSlide.style.transition = `opacity 1.4s cubic-bezier(0.33, 1, 0.68, 1), transform 1.4s cubic-bezier(0.33, 1, 0.68, 1)`;
      });

      updateChrome();

      window.setTimeout(() => {
        settleSlide(fromSlide);
        fromSlide.classList.remove("is-active");
        settleSlide(toSlide);
        toSlide.classList.add("is-active");
        if (!didMorph) clearMorphGhosts();
        animating = false;
      }, MORPH_MS + 120);
    }

    function setPresent(on) {
      clearMorphGhosts();
      animating = false;
      document.body.classList.toggle("is-present", on);
      document.body.classList.toggle("is-nav-hinted", false);
      presentBtn.textContent = on ? "Exit present" : "Present";
      if (on) {
        try { document.documentElement.requestFullscreen(); } catch (_) {}
        slides.forEach((s) => resetReveals(s));
        showInstant(index);
      } else {
        if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
        slides.forEach((s) => settleSlide(s));
        slides[index]?.classList.add("is-active");
        updateChrome();
      }
    }

    presentBtn.addEventListener("click", () => setPresent(!document.body.classList.contains("is-present")));

    const EXPORT_SLIDE_W = 1100;
    const EXPORT_SLIDE_H = 619;
    const EXPORT_PDF_W_MM = 338.67;
    const EXPORT_PDF_H_MM = 190.5;
    const EXPORT_FILE_BASE = "project-promotion";

    function exportSlideSize() {
      // Keep the original capture size that looked good — stretch in the PDF.
      return { w: EXPORT_SLIDE_W, h: EXPORT_SLIDE_H };
    }

    function preparePdfViewSlides() {
      slides.forEach((s) => {
        settleSlide(s);
        setOutcomeBuilt(s, true);
        s.querySelectorAll(".outcome-lanes .podium-col").forEach((c) => {
          c.classList.add("is-built", "is-revealed");
        });
        s.classList.add("is-active");
      });
    }

    function setPdfView(on) {
      if (on && document.body.classList.contains("is-present")) setPresent(false);
      clearMorphGhosts();
      document.body.classList.toggle("is-pdf-view", on);
      if (on) {
        preparePdfViewSlides();
        window.scrollTo({ top: 0, behavior: "smooth" });
        setExportStatus("PDF version — scroll the big slides, then Download PDF for your boss.", "success");
      } else {
        slides.forEach((s, n) => {
          settleSlide(s);
          s.classList.toggle("is-active", n === index);
        });
        setExportStatus("");
        updateChrome();
      }
    }

    document.getElementById("pdfViewBtn")?.addEventListener("click", () => setPdfView(true));
    document.getElementById("pdfBackBtn")?.addEventListener("click", () => setPdfView(false));

    function restoreInlineStyle(el, prop, value) {
      if (value) el.style.setProperty(prop, value);
      else el.style.removeProperty(prop);
    }

    function prepareSlideForExport(slideEl) {
      slideEl.classList.add("is-export-capture", "is-active");
      slideEl.classList.remove("is-leaving", "is-entering", "is-morphing-host");
      slides.forEach((s) => {
        s.classList.toggle("is-export-hidden", s !== slideEl);
      });
      settleSlide(slideEl);
      setOutcomeBuilt(slideEl, true);
      slideEl.querySelectorAll(".morph-ghost").forEach((g) => g.remove());
      slideEl.querySelectorAll(".outcome-lanes .podium-col").forEach((c) => {
        c.classList.add("is-built", "is-revealed");
      });
    }

    function cleanupSlideAfterExport(slideEl, saved) {
      slideEl.classList.remove("is-export-capture");
      slides.forEach((s) => s.classList.remove("is-export-hidden"));
      restoreInlineStyle(slideEl, "width", saved.width);
      restoreInlineStyle(slideEl, "height", saved.height);
      restoreInlineStyle(slideEl, "margin", saved.margin);
      restoreInlineStyle(slideEl, "max-width", saved.maxWidth);
      restoreInlineStyle(slideEl, "aspect-ratio", saved.aspectRatio);
      restoreInlineStyle(slideEl, "box-shadow", saved.boxShadow);
      restoreInlineStyle(slideEl, "border-radius", saved.borderRadius);
      restoreInlineStyle(slideEl, "overflow", saved.overflow);
      restoreInlineStyle(slideEl, "--slide-w", saved.slideW);
    }

    function setExportStatus(message, type = "") {
      const el = document.getElementById("exportStatus");
      if (!el) return;
      el.textContent = message || "";
      el.className = `toolbar__export-status${type ? ` toolbar__export-status--${type}` : ""}`;
    }

    function setExportBusy(busy) {
      const pdfBtn = document.getElementById("exportPdf");
      const slidesBtn = document.getElementById("exportSlides");
      const pdfViewBtn = document.getElementById("pdfViewBtn");
      const pdfBackBtn = document.getElementById("pdfBackBtn");
      if (pdfBtn) pdfBtn.disabled = busy;
      if (slidesBtn) slidesBtn.disabled = busy;
      if (pdfViewBtn) pdfViewBtn.disabled = busy;
      if (pdfBackBtn) pdfBackBtn.disabled = busy;
      presentBtn.disabled = busy;
    }

    function setExportOverlay(message) {
      const overlay = document.getElementById("export-overlay");
      if (!overlay) return;
      if (message) {
        overlay.textContent = message;
        overlay.classList.add("is-active");
      } else {
        overlay.textContent = "";
        overlay.classList.remove("is-active");
      }
    }

    function loadExportScript(src) {
      return new Promise((resolve, reject) => {
        if (document.querySelector(`script[src="${src}"]`)) {
          resolve();
          return;
        }
        const script = document.createElement("script");
        script.src = src;
        script.onload = () => resolve();
        script.onerror = () => reject(new Error("Could not load export library."));
        document.head.appendChild(script);
      });
    }

    function waitForImages(root) {
      const imgs = [...root.querySelectorAll("img")];
      return Promise.all(imgs.map((img) => {
        if (img.complete && img.naturalWidth > 0) return Promise.resolve();
        return new Promise((resolve) => {
          img.onload = () => resolve();
          img.onerror = () => resolve();
          setTimeout(resolve, 2500);
        });
      }));
    }

    function roundRectPath(ctx, x, y, w, h, r) {
      const rr = Math.min(r, w / 2, h / 2);
      ctx.beginPath();
      ctx.moveTo(x + rr, y);
      ctx.arcTo(x + w, y, x + w, y + h, rr);
      ctx.arcTo(x + w, y + h, x, y + h, rr);
      ctx.arcTo(x, y + h, x, y, rr);
      ctx.arcTo(x, y, x + w, y, rr);
      ctx.closePath();
    }

    /** Canvas paint of pitch + markers — used only for PDF/Slides export. Live deck keeps SVG. */
    function paintPitchPng(widthPx, heightPx, metric, markers) {
      const scale = 2;
      const c = document.createElement("canvas");
      c.width = Math.max(1, Math.round(widthPx * scale));
      c.height = Math.max(1, Math.round(heightPx * scale));
      const ctx = c.getContext("2d");
      const sx = c.width / 68;
      const sy = c.height / 105;
      const u = (x, y) => [x * sx, y * sy];

      const grass = ctx.createLinearGradient(0, 0, 0, c.height);
      grass.addColorStop(0, "#3d8f5c");
      grass.addColorStop(1, "#256b42");
      roundRectPath(ctx, 0, 0, c.width, c.height, 3 * sx);
      ctx.fillStyle = grass;
      ctx.fill();

      ctx.fillStyle = "rgba(255,255,255,0.05)";
      ctx.fillRect(...u(0, 0), 68 * sx, 17.5 * sy);
      ctx.fillRect(...u(0, 35), 68 * sx, 17.5 * sy);
      ctx.fillRect(...u(0, 70), 68 * sx, 17.5 * sy);

      ctx.strokeStyle = "rgba(255,255,255,0.88)";
      ctx.lineWidth = Math.max(1, 0.5 * sx);
      roundRectPath(ctx, 4 * sx, 4 * sy, 60 * sx, 97 * sy, 1 * sx);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(...u(4, 52.5));
      ctx.lineTo(...u(64, 52.5));
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(...u(34, 52.5), 7.5 * sx, 0, Math.PI * 2);
      ctx.stroke();
      roundRectPath(ctx, 18 * sx, 4 * sy, 32 * sx, 14 * sy, 0);
      ctx.stroke();
      roundRectPath(ctx, 18 * sx, 87 * sy, 32 * sx, 14 * sy, 0);
      ctx.stroke();

      markers.forEach(({ pos, val }) => {
        const slot = DATA.pitchSlots[pos];
        if (!slot) return;
        const isCf = pos === "CF";
        const isAm = pos === "AM";
        const mw = (isCf ? 13 : 11.5) * sx;
        const mh = (isCf ? 10.5 : 9.5) * sy;
        const cx = slot.x * sx;
        const cy = slot.y * sy;
        roundRectPath(ctx, cx - mw / 2, cy - mh / 2, mw, mh, 1.6 * sx);
        ctx.fillStyle = isCf ? "#f5c518" : "rgba(15,23,42,0.78)";
        ctx.fill();
        ctx.strokeStyle = isCf ? "#111111" : (isAm ? "rgba(147,197,253,0.9)" : "rgba(255,255,255,0.5)");
        ctx.lineWidth = Math.max(1, (isCf ? 0.5 : 0.35) * sx);
        ctx.stroke();

        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillStyle = isCf ? "#111111" : "rgba(255,255,255,0.92)";
        ctx.font = `700 ${Math.max(10, 2.8 * sx)}px "Barlow Condensed", "Arial Narrow", Arial, sans-serif`;
        ctx.fillText(pos, cx, cy - 1.1 * sy);
        ctx.fillStyle = isCf ? "#111111" : "#ffffff";
        ctx.font = `800 ${Math.max(14, (isCf ? 4.8 : 4.2) * sx)}px "Barlow Condensed", "Arial Narrow", Arial, sans-serif`;
        ctx.fillText(String(val), cx, cy + 3.6 * sy);
      });

      return c.toDataURL("image/png");
    }

    async function rasterizePitchSvgs(root) {
      const restores = [];
      const svgs = [...root.querySelectorAll(".goals-map__svg")];
      // Presentation keeps SVG. Export swaps to a Canvas-painted PNG so html2canvas
      // never touches SVG <text> (alphabet soup).
      await Promise.all(svgs.map((svg) => new Promise((resolve) => {
        try {
          const rect = svg.getBoundingClientRect();
          const w = Math.max(1, Math.round(rect.width));
          const h = Math.max(1, Math.round(rect.height));
          if (w < 8 || h < 8) {
            resolve();
            return;
          }
          const markers = [...svg.querySelectorAll("[data-pitch-pos]")].map((g) => ({
            pos: g.getAttribute("data-pitch-pos"),
            val: g.getAttribute("data-pitch-val"),
          }));
          const metric = svg.getAttribute("data-pitch-metric") || "goals";
          const png = paintPitchPng(w, h, metric, markers);
          const parent = svg.parentNode;
          if (!parent) {
            resolve();
            return;
          }
          const img = document.createElement("img");
          img.className = svg.getAttribute("class") || "goals-map__svg";
          img.alt = svg.getAttribute("aria-label") || "Pitch map";
          img.style.width = `${w}px`;
          img.style.height = `${h}px`;
          img.style.display = "block";
          img.style.maxWidth = "100%";
          img.style.maxHeight = "100%";
          img.style.objectFit = "contain";
          let settled = false;
          const done = () => {
            if (settled) return;
            settled = true;
            resolve();
          };
          img.onload = done;
          img.onerror = done;
          parent.replaceChild(img, svg);
          img.src = png;
          restores.push(() => {
            if (img.parentNode === parent) parent.replaceChild(svg, img);
          });
          setTimeout(done, 1200);
        } catch (_) {
          resolve();
        }
      })));
      return () => restores.reverse().forEach((undo) => undo());
    }

    function freezeExportLayout(root) {
      const restores = [];
      const snap = (el, props) => {
        const before = el.getAttribute("style");
        Object.entries(props).forEach(([key, val]) => {
          el.style.setProperty(key, val, "important");
        });
        restores.push(() => {
          if (before == null) el.removeAttribute("style");
          else el.setAttribute("style", before);
        });
      };

      // Measure first (while flex/grid still intact), then lock absolute positions.
      const plans = [];
      const planFreeze = (box) => {
        const rect = box.getBoundingClientRect();
        if (rect.height < 2) return;
        const kids = [...box.children]
          .map((child) => {
            const cr = child.getBoundingClientRect();
            if (cr.height < 1 || cr.width < 1) return null;
            return {
              child,
              left: Math.round(cr.left - rect.left),
              top: Math.round(cr.top - rect.top),
              width: Math.ceil(cr.width),
              height: Math.ceil(cr.height),
            };
          })
          .filter(Boolean);
        if (!kids.length) return;
        plans.push({
          box,
          height: Math.ceil(rect.height),
          width: Math.ceil(rect.width),
          kids,
        });
      };

      // Outside-in freeze. Do NOT freeze .phase-cmp__stack children —
      // keep Auto / Play-offs as a normal stacked flex column for capture.
      root.querySelectorAll(".phase-card").forEach(planFreeze);
      root.querySelectorAll(".phase-card__head, .lane__metric").forEach(planFreeze);
      root.querySelectorAll(".title-copy").forEach(planFreeze);
      root.querySelectorAll(".nn-list").forEach(planFreeze);
      root.querySelectorAll(".nn-list li").forEach(planFreeze);
      root.querySelectorAll(".nn-list li > div").forEach(planFreeze);
      root.querySelectorAll(".keynote__body").forEach(planFreeze);

      plans.forEach(({ box, height, width, kids }) => {
        const alreadyAbs = getComputedStyle(box).position === "absolute";
        snap(box, {
          display: "block",
          position: alreadyAbs ? "absolute" : "relative",
          height: `${height}px`,
          "min-height": `${height}px`,
          ...(width ? { width: `${width}px` } : {}),
          overflow: "visible",
        });
        kids.forEach(({ child, left, top, width: w, height: h }) => {
          // Preserve grid/flex so nested layouts (e.g. standards) stay intact.
          const childDisplay = getComputedStyle(child).display;
          const keepDisplay = (childDisplay === "grid" || childDisplay === "flex" || childDisplay === "inline-flex")
            ? childDisplay
            : "block";
          snap(child, {
            display: keepDisplay,
            position: "absolute",
            left: `${left}px`,
            top: `${top}px`,
            width: `${w}px`,
            height: `${h}px`,
            margin: "0",
            transform: "none",
            "z-index": "2",
          });
        });
      });

      return () => restores.reverse().forEach((undo) => undo());
    }

    function canvasLooksBlank(canvas) {
      const ctx = canvas.getContext("2d");
      if (!ctx) return true;
      const sampleW = Math.min(canvas.width, 80);
      const sampleH = Math.min(canvas.height, 80);
      const { data } = ctx.getImageData(0, 0, sampleW, sampleH);
      let nonWhite = 0;
      for (let i = 0; i < data.length; i += 16) {
        if (data[i] < 250 || data[i + 1] < 250 || data[i + 2] < 250) nonWhite += 1;
      }
      return nonWhite < 4;
    }

    async function captureSlideForExport(slideEl) {
      prepareSlideForExport(slideEl);

      const saved = {
        width: slideEl.style.width,
        height: slideEl.style.height,
        margin: slideEl.style.margin,
        maxWidth: slideEl.style.maxWidth,
        aspectRatio: slideEl.style.aspectRatio,
        boxShadow: slideEl.style.boxShadow,
        borderRadius: slideEl.style.borderRadius,
        overflow: slideEl.style.overflow,
        slideW: slideEl.style.getPropertyValue("--slide-w"),
      };

      const { w: EXPORT_SLIDE_W, h: EXPORT_SLIDE_H } = exportSlideSize();
      slideEl.style.setProperty("--slide-w", `${EXPORT_SLIDE_W}px`);
      slideEl.style.width = `${EXPORT_SLIDE_W}px`;
      slideEl.style.height = `${EXPORT_SLIDE_H}px`;
      slideEl.style.margin = "0 auto";
      slideEl.style.maxWidth = "none";
      slideEl.style.aspectRatio = "auto";
      slideEl.style.boxShadow = "none";
      slideEl.style.borderRadius = "0";
      slideEl.style.overflow = "hidden";

      const scrollX = window.scrollX;
      const scrollY = window.scrollY;
      slideEl.scrollIntoView({ block: "center", inline: "nearest" });

      await waitForImages(slideEl);
      if (document.fonts?.ready) await document.fonts.ready;
      await new Promise((resolve) => setTimeout(resolve, 80));
      await new Promise((resolve) => requestAnimationFrame(() => requestAnimationFrame(resolve)));

      const unrasterize = await rasterizePitchSvgs(slideEl);
      const unfreeze = freezeExportLayout(slideEl);
      await new Promise((resolve) => requestAnimationFrame(resolve));

      let canvas;
      try {
        canvas = await window.html2canvas(slideEl, {
          backgroundColor: "#ffffff",
          scale: 2,
          width: EXPORT_SLIDE_W,
          height: EXPORT_SLIDE_H,
          useCORS: true,
          allowTaint: true,
          logging: false,
          scrollX: -window.scrollX,
          scrollY: -window.scrollY,
          windowWidth: document.documentElement.clientWidth,
          windowHeight: document.documentElement.clientHeight,
        });
      } finally {
        unfreeze();
        unrasterize();
      }

      cleanupSlideAfterExport(slideEl, saved);
      window.scrollTo(scrollX, scrollY);

      if (canvasLooksBlank(canvas)) {
        throw new Error("Slide capture returned a blank image. Try refreshing and exporting again.");
      }
      return canvas;
    }

    async function captureAllSlides(onProgress) {
      await loadExportScript("https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js");
      if (!window.html2canvas) {
        throw new Error("Slide capture library failed to load.");
      }
      if (document.fonts?.ready) await document.fonts.ready;

      if (document.body.classList.contains("is-present")) setPresent(false);
      clearMorphGhosts();
      document.body.classList.add("is-exporting");

      // Ensure source slides are fully revealed before capture
      slides.forEach((s) => {
        settleSlide(s);
        setOutcomeBuilt(s, true);
        s.querySelectorAll(".outcome-lanes .podium-col").forEach((c) => {
          c.classList.add("is-built", "is-revealed");
        });
      });

      try {
        const canvases = [];
        for (let i = 0; i < slides.length; i += 1) {
          const message = `Capturing slide ${i + 1} of ${slides.length}…`;
          onProgress(message);
          setExportOverlay(message);
          canvases.push(await captureSlideForExport(slides[i]));
        }
        return canvases;
      } finally {
        document.body.classList.remove("is-exporting");
        slides.forEach((s) => s.classList.remove("is-export-capture", "is-export-hidden"));
        slides.forEach((s, n) => {
          settleSlide(s);
          s.classList.toggle("is-active", n === index);
        });
        updateChrome();
        setExportOverlay("");
      }
    }

    async function exportToPdf() {
      setExportBusy(true);
      try {
        if (!document.body.classList.contains("is-pdf-view")) setPdfView(true);
        setExportStatus("Preparing PDF from large slides…", "loading");
        const canvases = await captureAllSlides((msg) => setExportStatus(msg, "loading"));
        await loadExportScript("https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js");
        const { jsPDF } = window.jspdf;
        const pdf = new jsPDF({
          orientation: "landscape",
          unit: "mm",
          format: [EXPORT_PDF_W_MM, EXPORT_PDF_H_MM],
          compress: true,
        });
        canvases.forEach((canvas, i) => {
          // High-quality JPEG from 2× raster — sharp text, sane file size
          const imageData = canvas.toDataURL("image/jpeg", 0.95);
          if (i > 0) pdf.addPage([EXPORT_PDF_W_MM, EXPORT_PDF_H_MM], "landscape");
          pdf.addImage(imageData, "JPEG", 0, 0, EXPORT_PDF_W_MM, EXPORT_PDF_H_MM);
        });
        pdf.save(`${EXPORT_FILE_BASE}.pdf`);
        setExportStatus(`PDF downloaded (${canvases.length} slides). Still in PDF version — Back to deck when done.`, "success");
      } catch (err) {
        setExportStatus(err.message || "PDF export failed.", "error");
        console.error(err);
      } finally {
        setExportOverlay("");
        setExportBusy(false);
      }
    }

    async function exportToSlides() {
      setExportBusy(true);
      try {
        if (!document.body.classList.contains("is-pdf-view")) setPdfView(true);
        setExportStatus("Preparing Slides from large slides…", "loading");
        const canvases = await captureAllSlides((msg) => setExportStatus(msg, "loading"));
        await loadExportScript("https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js");
        if (!window.PptxGenJS) throw new Error("Slides export library failed to load.");
        const pptx = new PptxGenJS();
        pptx.defineLayout({ name: "PROJECT_PROMOTION_16x9", width: 13.333, height: 7.5 });
        pptx.layout = "PROJECT_PROMOTION_16x9";
        pptx.author = "Port Vale FC";
        pptx.title = "Project Promotion";
        pptx.subject = "The promotion blue print";
        canvases.forEach((canvas) => {
          const slide = pptx.addSlide();
          slide.addImage({
            data: canvas.toDataURL("image/png"),
            x: 0,
            y: 0,
            w: "100%",
            h: "100%",
          });
        });
        await pptx.writeFile({ fileName: `${EXPORT_FILE_BASE}.pptx` });
        setExportStatus("Slides downloaded — open in PowerPoint or Google Slides.", "success");
      } catch (err) {
        setExportStatus(err.message || "Slides export failed.", "error");
        console.error(err);
      } finally {
        setExportOverlay("");
        setExportBusy(false);
      }
    }

    document.getElementById("exportPdf").addEventListener("click", () => exportToPdf());
    document.getElementById("exportSlides").addEventListener("click", () => exportToSlides());
    document.addEventListener("fullscreenchange", () => {
      if (!document.fullscreenElement && document.body.classList.contains("is-present")) {
        setPresent(false);
      }
    });

    document.addEventListener("keydown", (e) => {
      if (e.target && /input|textarea|select/i.test(e.target.tagName)) return;
      if (e.key === "p" || e.key === "P") { setPresent(!document.body.classList.contains("is-present")); return; }
      if (e.key === "ArrowRight" || e.key === " " || e.key === "PageDown") {
        e.preventDefault();
        document.body.classList.add("is-nav-hinted");
        goForward();
      }
      if (e.key === "ArrowLeft" || e.key === "PageUp" || e.key === "Backspace") {
        e.preventDefault();
        document.body.classList.add("is-nav-hinted");
        goBack();
      }
      if (e.key === "Home") { e.preventDefault(); show(0); }
      if (e.key === "End") { e.preventDefault(); show(slides.length - 1); }
      if (e.key === "Escape" && document.body.classList.contains("is-present")) setPresent(false);
    });

    document.getElementById("presentPrev").addEventListener("click", (e) => {
      e.stopPropagation();
      document.body.classList.add("is-nav-hinted");
      goBack();
      updateChrome();
    });
    document.getElementById("presentNext").addEventListener("click", (e) => {
      e.stopPropagation();
      document.body.classList.add("is-nav-hinted");
      goForward();
      updateChrome();
    });

    // Click / swipe advance in present mode
    let touchX = null;
    document.addEventListener("click", (e) => {
      if (!document.body.classList.contains("is-present") || animating) return;
      if (e.target.closest(".present-ui, button, a, select")) return;
      document.body.classList.add("is-nav-hinted");
      const forward = e.clientX >= window.innerWidth / 2;
      if (forward) goForward();
      else goBack();
    });
    document.addEventListener("touchstart", (e) => {
      if (!document.body.classList.contains("is-present")) return;
      touchX = e.changedTouches[0].clientX;
    }, { passive: true });
    document.addEventListener("touchend", (e) => {
      if (!document.body.classList.contains("is-present") || touchX == null || animating) return;
      const dx = e.changedTouches[0].clientX - touchX;
      touchX = null;
      if (Math.abs(dx) < 40) return;
      document.body.classList.add("is-nav-hinted");
      if (dx < 0) goForward();
      else goBack();
    }, { passive: true });

    showInstant(0);
  </script>
</body>
