# IP + HTTPS edge — Caddy owns :80 and :443.
# Hostnames are in deploy/Caddyfile.ip (sportsanalysis.ai, pvfc, lmsc, bare IP).
# Do not drop the 443 mappings — that is how the public hostnames get certificates.
services:
  hub:
    build: .
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: 8000
      DATA_ROOT: /data
      SHARED_DATA_ROOT: /shared
      UVICORN_WORKERS: "1"
    volumes:
      - pv-data:/data
      - /opt/port-vale-analysis/shared:/shared
    restart: unless-stopped
    expose:
      - "8000"
    networks:
      default:
        aliases:
          - vale
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile.ip:/etc/caddy/Caddyfile:ro
      - ./static:/srv/static:ro
      - ./standalone:/srv/standalone:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      hub:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pv-data:
  caddy-data:
  caddy-config:
